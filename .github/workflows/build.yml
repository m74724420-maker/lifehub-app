name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy native audio recording files
        run: |
          PKG_DIR="android/app/src/main/java/com/maria/lifehub"
          mkdir -p "$PKG_DIR"
          cp native/android/AudioRecordingService.java "$PKG_DIR/"
          cp native/android/AudioRecordingPlugin.java "$PKG_DIR/"
          cp native/android/MainActivity.java "$PKG_DIR/"
          # Inject manifest permissions + service declaration
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = '''<uses-permission android:name="android.permission.RECORD_AUDIO" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
<uses-permission android:name="android.permission.WAKE_LOCK" />'''
          if "RECORD_AUDIO" not in s:
              s = s.replace("<application", perms + "\\n<application", 1)
          svc = '''<service android:name=".AudioRecordingService" android:foregroundServiceType="microphone" android:exported="false" />'''
          if "AudioRecordingService" not in s:
              s = s.replace("</application>", svc + "\\n</application>", 1)
          open(p, "w").write(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifehub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
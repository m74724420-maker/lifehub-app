name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy native audio recording files
        run: |
          PKG_DIR="android/app/src/main/java/com/maria/lifehub"
          mkdir -p "$PKG_DIR"
          cp native/android/AudioRecordingService.java "$PKG_DIR/"
          cp native/android/AudioRecordingPlugin.java "$PKG_DIR/"
          cp native/android/MainActivity.java "$PKG_DIR/"
          python3 native/android/patch_manifest.py

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifehub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
